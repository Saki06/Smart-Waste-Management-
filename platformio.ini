; Root bridge config so PlatformIO tasks run from workspace root
; while actual firmware files stay in hardware/

[platformio]
default_envs = esp32dev
src_dir = hardware/src
include_dir = hardware/include
lib_dir = hardware/lib
test_dir = hardware/test
extra_configs =
    hardware/platformio.ini
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all environments
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Default environment - Stage 3 Integrated System (with GPS + OTA)
[env:esp32dev]
board_build.partitions = min_spiffs.csv
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8
    mikalhart/TinyGPSPlus@^1.0.3
    me-no-dev/ESPAsyncWebServer@^1.2.4
    me-no-dev/AsyncTCP@^1.1.1
build_src_filter = +<*> -<.git/> -<.svn/>

; Test HC-SR04 Ultrasonic Sensor (Bin Fill Level)
[env:test_ultrasonic]
build_flags = -D TEST_ULTRASONIC
build_src_filter = +<../test_programs/test_hcsr04.cpp>

; Test Capacitive Moisture Sensor (Wetness Detection)
[env:test_moisture]
build_flags = -D TEST_MOISTURE
build_src_filter = +<../test_programs/test_moisture.cpp>

; Test PIR Motion Sensor (Motion Detection)
[env:test_pir]
build_flags = -D TEST_PIR
build_src_filter = +<../test_programs/test_pir.cpp>

; Test PIR Motion Sensor - RAW OUTPUT (Continuous Print)
[env:test_pir_raw]
build_flags = -D TEST_PIR_RAW
build_src_filter = +<../test_programs/test_pir_raw.cpp>

; Test GPS Module (Location Tracking)
[env:test_gps]
lib_deps = 
    mikalhart/TinyGPSPlus@^1.0.3
build_flags = -D TEST_GPS
build_src_filter = +<../test_programs/test_gps.cpp>

; Test GPS Module - DIAGNOSTIC (Check wiring and baud rate)
[env:test_gps_diagnostic]
build_flags = -D TEST_GPS_DIAGNOSTIC
build_src_filter = +<../test_programs/test_gps_diagnostic.cpp>

; RAT Test - Moisture Sensor ADC Direct Output (Quick Validation)
[env:rat_moisture_adc]
build_flags = -D RAT_MOISTURE_ADC
build_src_filter = +<../test_programs/rat_test_moisture_adc.cpp>
